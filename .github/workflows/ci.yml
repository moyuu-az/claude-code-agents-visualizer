name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # The Liquid Glass APIs need the macOS 26 SDK.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false  # nothing here pushes; later steps (tests, build) need no token
      - name: Toolchain
        run: swift --version
      - name: Test
        run: scripts/test.sh
      - name: Package (universal .dmg and .zip)
        run: UNIVERSAL=1 scripts/package.sh
      - uses: actions/upload-artifact@v7
        with:
          name: app
          path: |
            build/ClaudeCodeAgentsVisualizer-*.dmg
            build/ClaudeCodeAgentsVisualizer-*.zip
            build/SHA256SUMS.txt
          if-no-files-found: error
