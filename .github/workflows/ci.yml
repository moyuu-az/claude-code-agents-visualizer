name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # The Liquid Glass APIs need the macOS 26 SDK.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false  # nothing here pushes; later steps (tests, build) need no token
      - name: Toolchain
        run: swift --version
      - name: Test
        run: scripts/test.sh
      - name: Build app (universal)
        run: UNIVERSAL=1 scripts/build-app.sh
      - name: Package
        run: ditto -c -k --keepParent "build/Claude Code Agents Visualizer.app" "build/ClaudeCodeAgentsVisualizer.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: app
          path: build/ClaudeCodeAgentsVisualizer.zip
          if-no-files-found: error
